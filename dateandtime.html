<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>India Date & Time</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex items-start justify-start h-screen bg-gray-900 text-white">

  <div class="text-center bg-gray-800 p-6 rounded-xl shadow-lg m-2">
    <h1 class="text-2xl font-semibold mb-2">India Date & Time</h1>
    <p id="date" class="text-lg"></p>
    <p id="time" class="text-3xl font-bold mt-2"></p>
    <p class="text-sm ">by RACollection</p>

    <div class=" bg-gray-800 p-6 rounded-xl shadow-lg m-2 w w-full">
      <a href="" class="text-white text-lg font-bold">Apple Watch</a>
      <div class=" flex justify-end space-x-4">
        <a href="" class="text-white hover:bg-lime-600/20 px-3 py-2 rounded ">Home</a>
        <a href="" class="text-white hover:bg-lime-600/20 px-3 py-2 rounded ">Gallery</a>
        <a href="" class="text-white hover:bg-lime-600/20 px-3 py-2 rounded ">About</a>
        <a href="" class="text-white hover:bg-lime-600/20 px-3 py-2 rounded ">Contact</a>
      </div>

      <div class=" bg-gray-900 p-6 rounded-xl shadow-lg m-2 w w-full  hover:bg-lime-600/20">
        <div class="">
          <a href="" class="text-white hover:bg-lime-600 px-3 py-2 rounded ">Login</a>
        </div>

        <div class="md:hidden">
          <button id="menu-toggle" class="text-white">
            <i class="fa-solid fa-bars"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
  <script>
    function updateIndiaTime() {
      const now = new Date();
      const dateOptions = {
        timeZone: "Asia/Kolkata",
        year: "numeric",
        month: "long",
        day: "numeric"
      };

      const timeOptions = {
        timeZone: "Asia/Kolkata",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: true
      };

      document.getElementById("date").textContent =
        new Intl.DateTimeFormat("en-IN", dateOptions).format(now);

      document.getElementById("time").textContent =
        new Intl.DateTimeFormat("en-IN", timeOptions).format(now);
    }

    updateIndiaTime();
    setInterval(updateIndiaTime, 1000); // update every second
  </script>

</body>

</html>
